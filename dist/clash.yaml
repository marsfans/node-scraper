proxy-groups:
- name: 自动选择
  type: url-test
  proxies: &id001
  - 香港
  - 台湾
  - 新加坡
  - 美国
  - 韩国
  - 日本
  - 亚洲
  - 欧洲
  - 非洲
  - 美洲
  - 大洋洲
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 手动选择
  type: select
  proxies: *id001
- name: 香港
