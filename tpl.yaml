  tolerance: 50
- name: 美洲
  type: url-test
  include-all-proxies: true
  filter: ^(AG|AR|AW|BB|BM|BO|BQ|BR|BS|BZ|CA|CL|CO|CR|CU|CW|DM|DO|EC|FK|GD|GL|GP|GT|GY|HN|HT|JM|KN|LC|MQ|MX|NI|PA|PE|PR|PY|SR|SV|TT|UY|VC|VE)
